aid: slingshot-aerospace
name: Slingshot Aerospace
description: >-
  Slingshot Aerospace is a space operations intelligence and autonomy (SOIA)
  company that turns sensing, data fusion, and simulation into operational
  action for satellite operators, defense, and civil space agencies. Its Portal
  platform and Developer Suite expose orbital intelligence through APIs — the GSN
  Data API for near-real-time observations, state vectors, and tracking metrics
  from the Global Sensor Network and Sovereign Space Object Tracking (SSOT); the
  Seradata API for global satellite and launch intelligence, mission metadata,
  reliability history, and operator context; and a forthcoming MCP Insights
  Server exposing analytics, fusion results, and AI-derived insights from the
  Agatha AI and TALOS AI pipelines. API access is managed through the Portal
  with API-key credentials and RBAC, and usage is metered in Slingshot
  Processing Units (SPUs).
